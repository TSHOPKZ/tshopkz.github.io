<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSHOP · Бот учится</title><meta name="robots" content="noindex">
<style>
:root{--bg:#0f1115;--card:#181b21;--line:#272b33;--tx:#e9e7e2;--mut:#8f8d87;--ok:#3fb950;--warn:#e3a52f;--bad:#f0524f;--acc:#e03c3c;--blue:#4a9eff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:18px}header .sum{color:var(--mut);font-size:14px}
header a{margin-left:auto;font-size:15px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;color:var(--tx);text-decoration:none}
main{max-width:760px;margin:0 auto;padding:14px 16px 60px}
h2{font-size:16px;margin:22px 0 10px;color:var(--tx)}h2 small{color:var(--mut);font-weight:400;font-size:13px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;border-left:5px solid var(--blue)}
.c.l{border-left-color:var(--warn)}.c.g{border-left-color:#b48cff}.c.k{border-left-color:var(--bad)}.c.d{border-left-color:#3a3f4a}
.c .k1{font-size:12.5px;color:var(--mut);margin-bottom:4px}.c .tx{white-space:pre-wrap;word-wrap:break-word}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#232833;color:var(--tx);padding:8px 13px;font-size:14px}
button.y{background:#173222;border-color:#2b5a3a;color:#8fe0a4;font-weight:700}button.n{color:#ff9d9a}button.p{background:var(--acc);border:0;color:#fff;font-weight:700}
button:disabled{opacity:.5}
textarea{width:100%;margin-top:10px;background:#101318;border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;padding:9px 11px;min-height:64px;resize:vertical}
.opt{margin-top:8px;padding:8px 10px;border-radius:10px;background:#11151b;border:1px solid var(--line)}.opt b{margin-right:6px}
.pr{padding:9px 0;border-top:1px solid var(--line)}.pr:first-of-type{border-top:0}.pr .nm{font-weight:700}.pr .nm.u{color:#ff8c8a}
.pr .sg{margin-top:5px;padding:7px 9px;border-radius:9px;background:#16263d;color:#bcd8ff;font-size:14px}
.pr .btns{margin-top:6px}.pr button{padding:5px 10px;font-size:13px}
.mut{color:var(--mut);font-size:13.5px}.empty{color:var(--mut);padding:14px 4px}
details{margin-top:6px}summary{cursor:pointer;color:var(--mut);font-size:13.5px}
.lr{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.lr:first-child{border-top:0}
.lr .tx{flex:1;font-size:14px}.lr .tg{font-size:11.5px;color:var(--mut);display:block;margin-bottom:2px}.lr button{flex:none;padding:4px 9px;font-size:12.5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a3942;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9;max-width:90vw}
.done{opacity:.55}
</style></head><body data-tab="bot">
<script>
// 26.11 (Алмаз: «сверху панель, чтобы не нажимать назад, а сразу переходить»): общая панель переходов во всех окнах приложения
(function(){const IN_=window.top!==window,cur=document.body.dataset.tab||"";
const T=[["orders","📦 Заказы"],["chats","💬 Чаты"],["pcs","🖥 ПК"],["bot","🧠 Бот"],["content","🎨 Контент"],["buy","🛒 Закуп"]];
const n=document.createElement("nav");n.id="tnav";
n.innerHTML=T.map(([k,l])=>'<button data-t="'+k+'"'+(k===cur?' class="on"':'')+'>'+l+'</button>').join("");
document.body.prepend(n);
n.onclick=e=>{const b=e.target.closest("[data-t]");if(!b||b.dataset.t===cur)return;
  if(IN_)window.parent.postMessage({nav:b.dataset.t},location.origin);else location.href="/z/app.html#"+b.dataset.t};
const s=document.createElement("style");
s.textContent="#tnav{position:sticky;top:0;z-index:6;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#0b0d11;border-bottom:1px solid #272b33;scrollbar-width:none}#tnav::-webkit-scrollbar{display:none}#tnav button{flex:none;font:600 13.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#c9c7c2;background:#1a1d24;border:1px solid #272b33;border-radius:10px;padding:6px 10px;cursor:pointer}@media(min-width:700px){#tnav{justify-content:center}}#tnav button.on{background:#e03c3c;border-color:#e03c3c;color:#fff}";
document.head.appendChild(s);
const fix=()=>{const h=n.offsetHeight;document.querySelectorAll("header").forEach(x=>{if(getComputedStyle(x).position==="sticky")x.style.top=h+"px"})};
fix();addEventListener("resize",fix)})();
</script>

<header><b>🧠 Бот учится</b><span class="sum" id="sum">загружаю…</span><a href="#" onclick="goApp();return false">← Назад</a></header>
<main id="m"></main><div id="toast"></div>
<script>
// Вкладка «🧠 Бот» (решение Алмаза 25.11): всё, чему учится клиентский бот, — здесь, а не пачкой в Telegram.
// Данные — GET /api/botlearn (bot_inbox.py), решения — POST /api/botlearn {act,id,text}.
const IN=window.top!==window;
function goApp(){if(IN)window.parent.postMessage({bot:"close"},location.origin);else location.href='/z/app.html'}
function goChat(id){if(IN)window.parent.postMessage({bot:"chat",id},location.origin);else location.href='/z/app.html#chat:'+id}
const LS={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}}};
const DEV=LS.get("tshop_dev");let API="",D=null,OPEN={};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function txt(h){return String(h||"").replace(/<br\s*\/?>/g,"\n").replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')}
async function apiBase(){if(API)return API;const j=await (await fetch("/z/api.json?"+Date.now(),{cache:"no-store"})).json();
  if(j.direct){try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),2500);const r=await fetch(j.direct+"/ping",{cache:"no-store",signal:c.signal});clearTimeout(tm);if(r.ok){API=j.direct;return API}}catch(e){}}
  API=j.base||"";return API}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
async function send(act,id,text,btn){
  if(btn)btn.disabled=true;
  try{const b=await apiBase();const r=await fetch(b+"/api/botlearn",{method:"POST",headers:{"X-Dev":DEV,"Content-Type":"text/plain"},body:JSON.stringify({act,id,text:text||""})});
    const j=await r.json();toast(j.msg||(r.ok?"Готово":"Не вышло"));if(r.ok){delete OPEN[id];await load();if(IN)window.parent.postMessage({bot:"n"},location.origin)}else if(btn)btn.disabled=false}
  catch(e){toast("Нет связи — попробуй ещё раз");if(btn)btn.disabled=false}}
function own(id,ph,act){const v=OPEN[id]||"";return `<textarea data-ta="${esc(id)}" placeholder="${esc(ph)}">${esc(v)}</textarea>
  <div class="btns"><button class="p" data-a="${act}" data-id="${esc(id)}">Сохранить</button><button data-close="${esc(id)}">Отмена</button></div>`}
function lessonHTML(x){return `<div class="c l"><div class="k1">📚 Урок от надзора · ${esc(x.at)}</div><div class="tx">${esc(x.text)}</div>
  ${x.id in OPEN?own(x.id,"Как бот должен делать — твоими словами","own"):`<div class="btns"><button class="y" data-a="ok" data-id="${esc(x.id)}">✅ Учесть</button>
  <button class="n" data-a="no" data-id="${esc(x.id)}">✖️ Не надо</button><button data-open="${esc(x.id)}">✍️ Своими словами</button></div>`}</div>`}
function gapHTML(x){return `<div class="c g"><div class="k1">❓ Бот не знал, что ответить · ${esc(x.at)}</div><div class="tx">${esc(x.q)}</div>
  ${own(x.id,"Твой ответ одной строкой — бот запомнит и будет отвечать сам","gap").replace(/<button data-close="[^"]*">Отмена<\/button>/,'<button class="n" data-a="gapskip" data-id="'+esc(x.id)+'">Не нужно</button>')}</div>`}
function confHTML(x){return `<div class="c k"><div class="k1">⚖️ Правила спорят · ${esc(x.at)}</div>${x.q?`<div class="tx"><b>${esc(x.q)}</b></div>`:""}
  <div class="opt"><b>1️⃣</b>${esc(x.a)}</div><div class="opt"><b>2️⃣</b>${esc(x.b)}${x.b_main?' <span class="mut">(основное правило бота)</span>':""}</div>
  ${x.id in OPEN?own(x.id,"Как правильно — твоими словами","cown"):`<div class="btns"><button class="y" data-a="ca" data-id="${esc(x.id)}">1️⃣ Первое</button>
  <button class="y" data-a="cb" data-id="${esc(x.id)}">2️⃣ Второе</button><button data-open="${esc(x.id)}">✍️ Своими словами</button></div>`}</div>`}
function dayHTML(r,first){const p=r.probs||[];
  const body=`${r.summary?`<div class="tx">${esc(r.summary)}</div>`:""}${r.help?`<div class="mut" style="margin-top:6px">🛠 Помощь людям: ${esc(r.help)}</div>`:""}
  ${p.length?p.map(x=>`<div class="pr"><div class="nm${x.urgent?" u":""}">${x.urgent?"🔴":"🟡"} ${esc(x.name)}</div><div class="tx">${esc(x.problem)}</div>
    ${x.send?`<div class="sg">Предлагаю написать: «${esc(x.send)}»</div>`:""}<div class="btns"><button data-chat="${esc(x.id)}">💬 Открыть чат</button>
    ${x.send?`<button data-copy="${esc(x.send)}">📋 Скопировать текст</button>`:""}</div></div>`).join(""):`<div class="mut">Промахов не нашёл.</div>`}`;
  return `<div class="c d"><div class="k1">🧐 ${esc(r.day||r.at)} · проверил переписок: ${r.n||0}, с промахами: ${p.length}</div>${first?body:`<details><summary>Показать</summary>${body}</details>`}</div>`}
function tidyHTML(r){return `<div class="c d"><div class="k1">🧹 Чистка правил · ${esc(r.at)}</div><details><summary>Отчёт</summary><div class="tx" style="margin-top:6px">${esc(txt(r.text))}</div></details>
  ${r.backup?`<div class="btns"><button class="n" data-undo="${esc(r.backup)}">↩️ Вернуть как было</button></div>`:""}</div>`}
const KIND={owner:"из твоего ответа клиенту",gap:"твой ответ на «чего не знал»",own:"твоими словами",lesson:"урок надзора"};
function render(){const d=D,m=document.getElementById("m");
  document.getElementById("sum").textContent=d.n?`ждут тебя: ${d.n}`:"всё решено ✅";
  let h=`<h2>Ждут тебя <small>${d.n?"— реши, и бот сразу начнёт так делать":""}</small></h2>`;
  const wait=[...d.conflicts.map(confHTML),...d.gaps.map(gapHTML),...d.lessons.map(lessonHTML)];
  h+=wait.length?wait.join(""):`<div class="empty">Нечего решать — всё разобрано ✅</div>`;
  if(d.days.length)h+=`<h2>Разбор переписок <small>— надзор каждый вечер после 22:00</small></h2>`+d.days.map((r,i)=>dayHTML(r,i===0)).join("");
  if(d.tidy.length)h+=`<h2>Чистка правил</h2>`+d.tidy.map(tidyHTML).join("");
  h+=`<h2>Бот уже знает <small>— последние ${d.learned.length}${d.book&&d.book.n?`, ещё ${d.book.n} в своде правил`:""}</small></h2>`;
  h+=d.learned.length?`<div class="c d">${d.learned.map(x=>`<div class="lr"><div class="tx"><span class="tg">${esc(KIND[x.kind]||"")} · ${esc(x.at)}</span>${esc(x.text)}</div>
    <button class="n" data-forget="${esc(x.id)}">✖️ Больше не надо</button></div>`).join("")}</div>`:`<div class="empty">Пока пусто.</div>`;
  m.innerHTML=h}
document.addEventListener("input",e=>{const t=e.target.closest("[data-ta]");if(t)OPEN[t.dataset.ta]=t.value});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.open!=null){OPEN[b.dataset.open]="";render();const t=document.querySelector(`[data-ta="${CSS.escape(b.dataset.open)}"]`);if(t)t.focus();return}
  if(b.dataset.close!=null){delete OPEN[b.dataset.close];const t=document.querySelector(`[data-ta="${CSS.escape(b.dataset.close)}"]`);if(t)t.value="";render();return}
  if(b.dataset.chat){goChat(b.dataset.chat);return}
  if(b.dataset.copy){navigator.clipboard.writeText(b.dataset.copy).then(()=>toast("Скопировал — вставь в чат"),()=>toast("Не скопировалось"));return}
  if(b.dataset.undo){if(confirm("Вернуть правила как были до этой чистки?"))send("undo",b.dataset.undo,"",b);return}
  if(b.dataset.forget){if(confirm("Бот больше не будет так делать. Убрать?"))send("no",b.dataset.forget,"",b);return}
  const a=b.dataset.a,id=b.dataset.id;if(!a)return;
  if(["own","gap","cown"].includes(a)){const v=(OPEN[id]||"").trim();if(!v){toast("Напиши ответ");return}send(a,id,v,b);return}
  send(a,id,"",b)});
async function load(){
  if(!DEV){document.getElementById("m").innerHTML=`<div class="empty">Открой через приложение «TSHOP Заказы».</div>`;return}
  try{const b=await apiBase();const r=await fetch(b+"/api/botlearn",{headers:{"X-Dev":DEV},cache:"no-store"});
    if(r.status===403){document.getElementById("m").innerHTML=`<div class="empty">⛔ Нет доступа — открой через приложение.</div>`;return}
    D=await r.json();if(!document.activeElement||!document.activeElement.matches("textarea"))render()}
  catch(e){API="";document.getElementById("sum").textContent="нет связи — повторю"}}
load();setInterval(load,30000);
</script></body></html>
