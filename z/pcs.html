<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSHOP · ПК в работе</title><meta name="robots" content="noindex">
<style>
:root{--bg:#0f1115;--card:#181b21;--line:#272b33;--tx:#e9e7e2;--mut:#8f8d87;--ok:#3fb950;--warn:#e3a52f;--bad:#f0524f;--acc:#e03c3c;--blue:#4a9eff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header b{font-size:18px}header .sum{color:var(--mut);font-size:14px}header a{color:var(--mut);text-decoration:none;margin-left:auto;font-size:14px}
main{padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
@media(max-width:600px){main{grid-template-columns:1fr;padding:10px}}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-left:5px solid var(--blue)}
.c.ok{border-left-color:var(--ok)}.c.bad{border-left-color:var(--bad)}.c.warn{border-left-color:var(--warn)}.c.off{opacity:.55;border-left-color:#555}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.ord{font-size:20px;font-weight:800}.pc{color:var(--mut);font-size:13px}
.badge{font-size:12px;padding:2px 8px;border-radius:20px;background:#262a32;color:var(--mut)}.badge.r{background:#3a1d1d;color:#ff8c8a}.badge.y{background:#3a2f15;color:#f3c35c}.badge.g{background:#173222;color:#6fd68a}
.hw{color:var(--mut);font-size:13px;margin:4px 0 8px}
.bar{height:10px;background:#262a32;border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--blue)}
.c.ok .bar i{background:var(--ok)}.c.bad .bar i{background:var(--bad)}
.now{font-weight:600;margin:6px 0}.eta{color:var(--mut);font-size:13px}
ul.st{list-style:none;padding:0;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:13.5px}
ul.st li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}ul.st li.a{color:var(--tx);font-weight:700}ul.st li.f{color:var(--bad);font-weight:700}ul.st li.d{color:#9fc9a9}
.pr{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:#2a1616;font-size:13.5px}.pr.w{background:#2a2312}
.pr div+div{margin-top:4px}.pr b{color:#ff8c8a}.pr.w b{color:#f3c35c}
.need{margin-top:8px;padding:8px 10px;border-radius:10px;background:#16263d;color:#9cc8ff;font-weight:600;font-size:14px}
details{margin-top:8px}summary{cursor:pointer;color:var(--mut);font-size:13px}pre{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,Consolas,monospace;color:#cfcac0;margin:6px 0 0}
ul.it{list-style:none;padding:0;margin:8px 0;font-size:13.5px}ul.it li{display:flex;gap:7px;align-items:flex-start;padding:2px 0}
ul.it li .ic{width:18px;text-align:center;flex:none}ul.it li.ok{color:#8fd6a0}ul.it li.pl{color:#77756f}ul.it li.ru{color:#7fb6ff;font-weight:700}
ul.it li.fa{color:#ff8c8a;font-weight:700}ul.it li.wa{color:#f3c35c}ul.it li small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
ul.ts{list-style:none;padding:4px 0 2px 4px;margin:4px 0 0;border-left:2px solid #2a2f39;font-size:13px;font-weight:400}ul.ts li{padding:2px 0 2px 6px}ul.ts li.ok{color:#8fd6a0}ul.ts li.fa{color:#ff8c8a;font-weight:700}ul.ts li.wa{color:#f3c35c}ul.ts li.ru{color:#7fb6ff;font-weight:700}ul.ts li.pl{color:#77756f}ul.ts li small{color:var(--mut);font-weight:400}
details.tsd{margin-top:2px}details.tsd summary{font-size:12.5px}
.nx{margin:8px 0;padding:9px 11px;border-radius:10px;background:#1b2435;border:1px solid #2c3a55;font-size:14px}.nx>b{display:block;color:#9cc8ff;margin-bottom:4px}
.nx div{display:flex;gap:8px;align-items:center;padding:3px 0}.nx div span{flex:1}.nx button{flex:none;background:#2a3f63;color:#fff;border:1px solid #3d5a8a;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.cp{margin-left:auto;flex:none;font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid #5a2a2a;background:#2a1616;color:#ff8c8a;cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.acts button{background:#232833;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
.acts button:hover{border-color:#4a9eff}.acts button.dn{color:#ff8c8a}
.cm{margin-top:8px;font-size:12.5px;color:var(--mut)}.cm div{padding:1px 0}.cm .run{color:#7fb6ff}.cm .ok{color:#8fd6a0}.cm .fail,.cm .lost{color:#ff8c8a}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}#sheet.on{display:flex}
#sheet .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(460px,94vw);max-height:84vh;overflow:auto}
#sheet h3{margin:0 0 10px;font-size:16px}#sheet label{display:flex;gap:8px;padding:5px 0;font-size:14px;cursor:pointer}#sheet label.hv{color:var(--mut)}
#sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}#sheet .row button{border-radius:9px;padding:8px 14px;border:0;cursor:pointer;font-size:14px}
#sheet .go{background:var(--acc);color:#fff}#sheet .go.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}#sheet .go.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff4}#sheet .go.hold.ing i{width:100%;transition:width 2s linear}#sheet .no{background:#2a2f39;color:var(--tx)}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#232833;border:1px solid var(--line);padding:9px 14px;border-radius:10px;display:none;z-index:10}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 10px;font-size:17px}
</style></head><body>
<header><b>🖥 ПК в работе</b><span class="sum" id="sum">загружаю…</span><a href="#" onclick="goApp();return false" style="font-size:15px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;color:var(--tx)">← Заказы и чаты</a></header>
<main id="list"></main><div id="sheet"><div class="box" id="sbox"></div></div><div id="toast"></div>
<script>
// Окно «ПК в работе» (решение Алмаза 25.11 17:18). Данные — GET /api/pcs (pc_live.py), ПК присылают их сами раз в минуту.
const IN=window.top!==window;
function goOrder(id){if(IN)window.parent.postMessage({pcs:"order",id},location.origin);else location.href='/z/app.html#order:'+id}
function goApp(){if(IN)window.parent.postMessage({pcs:"close"},location.origin);else location.href='/z/app.html'}
const LS={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}}};
const DEV=LS.get("tshop_dev");let API="";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function apiBase(){if(API)return API;const j=await (await fetch("/z/api.json?"+Date.now(),{cache:"no-store"})).json();
  if(j.direct){try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),2500);const r=await fetch(j.direct+"/ping",{cache:"no-store",signal:c.signal});clearTimeout(tm);if(r.ok){API=j.direct;return API}}catch(e){}}
  API=j.base||"";return API}
const ICON={done:"✅",ok:"✅",active:"▶️",running:"▶️",pending:"⏳",failed:"❌",crashed:"💥",skipped:"⏭",skip:"⏭"};
function ago(s){if(s<90)return "только что";if(s<3600)return Math.round(s/60)+" мин назад";if(s<86400)return Math.round(s/3600)+" ч назад";return Math.round(s/86400)+" дн назад"}
function txt(h){return String(h||"").replace(/<br\s*\/?>/g,"\n").replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')}
// 25.11 18:45 (Алмаз): ПК принесли без установки — флешка TEST\DIAG.bat в Windows клиента, выбор режима и итог здесь
const MODEN={warranty:"🛠 Гарантия / сервис",tradein:"💰 Трейд-ин / выкуп",quick:"⚡ Быстрая проверка"};
function checkCard(p){
  const bad=(p.items||[]).filter(x=>x.s==="FAIL"),w=(p.items||[]).filter(x=>x.s==="WARN"),ok=(p.items||[]).filter(x=>x.s==="OK");
  const cls=p.off&&!p.fin?"off":p.fin?(bad.length?"bad":w.length?"warn":"ok"):"";
  const st=p.fin?`<span class="badge ${bad.length?"r":w.length?"y":"g"}">${esc(p.verdict||"готово")}</span>`:p.off?`<span class="badge">нет связи · ${ago(p.ago)}</span>`:`<span class="badge">идёт · ${ago(p.ago)}</span>`;
  const pick=!p.mode&&!p.off?`<div class="need">Что делаем с этим компьютером? (или 1/2/3 на самом ПК)</div><div class="acts">
    <button data-mode="warranty" data-pc="${esc(p.pc)}">🛠 Гарантия / сервис · ошибки, что ставили, тест 15 мин</button>
    <button data-mode="tradein" data-pc="${esc(p.pc)}">💰 Трейд-ин / выкуп · тест 15 мин + оценка</button>
    <button data-mode="quick" data-pc="${esc(p.pc)}">⚡ Быстро · 2 мин без теста</button></div>`:"";
  const li=(a,ic,c)=>a.map(x=>`<li class="${c}"><span class="ic">${ic}</span><span>${esc(x.t)}</span>${c==="fa"?`<button class="cp" data-cpc="${esc(p.pc)}">📋 Для Claude</button>`:""}</li>`).join("");
  return `<div class="c ${cls}"><div class="top"><span class="ord">🔎 ${p.mode?MODEN[p.mode]:"Проверка без установки"}</span><span class="pc">${esc(p.pc)}</span>${st}</div>
  ${[p.cpu,p.gpu,p.ram].filter(Boolean).length?`<div class="hw">${[p.cpu,p.gpu,p.ram].filter(Boolean).map(esc).join(" · ")}</div>`:""}
  ${p.fin?"":`<div class="bar"><i style="width:${Math.max(2,Math.min(100,p.pct||0))}%"></i></div>`}
  ${p.now&&!p.fin?`<div class="now">▶ ${esc(p.now)}</div>`:""}
  ${pick}
  ${p.own?`<div class="now" style="font-weight:600">${esc(p.own)}</div>`:""}
  ${p.fin?`<ul class="it">${li(bad,"❌","fa")}${li(w,"⚠️","wa")}${li(ok,"✅","ok")}</ul>`:""}
  ${p.fin&&(p.mode==="warranty"||p.mode==="quick")?(p.ai?`<details open><summary>🧠 Вывод: что было и гарантия ли это</summary><pre>${esc(p.ai)}</pre></details>`:`<div class="now">🧠 ИИ разбирает, что было с компьютером…</div>`):""}
  ${p.est?`<details open><summary>💰 Оценка трейд-ина</summary><pre>${esc(p.est)}</pre></details>`:""}
  ${p.fin&&(p.ext||{}).progs&&p.ext.progs.length?`<details><summary>📦 Что ставили после установки Windows (${p.ext.progs.length})</summary><pre>${esc(p.ext.progs.join("\n"))}${(p.ext.drivers||[]).length?"\n\nДрайверы:\n"+esc(p.ext.drivers.join("\n")):""}</pre></details>`:""}
  ${p.text&&p.fin?`<details><summary>Подробно</summary><pre>${esc(p.text)}</pre></details>`:""}
  ${p.fin?`<div class="eta">Компьютер можно отдавать или выключать — на нём ничего не осталось. Отчёт ушёл и в Telegram.</div>`:""}</div>`}
function card(p){if(p.kind==="check")return checkCard(p);
  const fail=(p.st||[]).some(s=>s[1]==="failed"||s[1]==="crashed")||(p.problems||[]).some(x=>x.s==="FAIL");
  const warn=(p.problems||[]).some(x=>x.s==="WARN");
  const W=p.wipe||{},rushRun=(p.cmds||[]).some(c=>c.act==="rush"&&(c.st==="ok"||c.st==="run")&&Date.now()/1000-c.t<1800);
  let wst=W.st||(rushRun?"wipestart":"");
  if(wst==="wipestart"&&p.off)wst="wiped";   // 25.11 18:53 (Алмаз): почистился и отключился — значит отдан, «чистится…» не висит   // уборка: wipestart — чистится, wiped — готов к выдаче, wipefail — не вышло
  const cls=wst==="wiped"?"ok":wst==="wipefail"?"bad":p.off&&!wst?"off":fail?"bad":p.fin?"ok":warn?"warn":"";
  const who=p.order?`<a href="#" onclick="goOrder('${esc(p.order)}');return false" style="color:inherit">Заказ ${esc(p.order)}</a>`:p.svc?(p.svc==="trade"?"💰 Трейд-ин / выкуп":`Сервис ${esc(p.svc)}`):"Без заказа";
  let b=[];
  if(wst==="wiped")b.push(`<span class="badge g">${p.off?"почищен · отключён":"почищен · можно отдавать"}</span>`);
  else if(wst==="wipestart")b.push(`<span class="badge y">чистится…</span>`);
  else if(wst==="wipefail")b.push(`<span class="badge r">уборка не прошла</span>`);
  else if(p.off)b.push(`<span class="badge">нет связи · ${ago(p.ago)}</span>`);
  else if(fail)b.push(`<span class="badge r">ошибка</span>`);
  else if(p.fin)b.push(`<span class="badge g">готов</span>`);
  else b.push(`<span class="badge">идёт · ${ago(p.ago)}</span>`);
  if(p.name)b.push(`<span class="badge">${esc(p.name)}</span>`);
  const hw=[p.cpu,p.gpu,p.ram].filter(Boolean).map(esc).join(" · ");
  const st=(p.st||[]).map(s=>{const c=s[1]==="active"||s[1]==="running"?"a":(s[1]==="failed"||s[1]==="crashed")?"f":(s[1]==="done"||s[1]==="ok")?"d":"";
    return `<li class="${c}">${ICON[s[1]]||"·"} ${esc(s[0])}</li>`}).join("");
  const act=(p.st||[]).find(s=>s[1]==="active"||s[1]==="running");
  const nx=(p.st||[]).find(s=>!s[1]||s[1]==="pending");
  const now=p.now||(p.fin?"Всё сделано":act?act[0]:"");
  const bad=(p.problems||[]).filter(x=>x.s==="FAIL"),w=(p.problems||[]).filter(x=>x.s==="WARN");
  const pr=(a,c)=>a.length?`<div class="pr ${c}">${a.map(x=>`<div><b>${esc(x.t)}</b>${x.n?" — "+esc(x.n):""}</div>`).join("")}</div>`:"";
  return `<div class="c ${cls}"><div class="top"><span class="ord">${who}</span><span class="pc">${esc(p.pc)}</span>${b.join("")}</div>
  ${hw?`<div class="hw">${hw}</div>`:""}
  <div class="bar"><i style="width:${Math.max(2,Math.min(100,p.pct||0))}%"></i></div>
  <div class="eta">${p.pct||0}%${p.eta&&!p.fin?` · готов примерно к ${esc(p.eta)}`:""}${nx&&!p.fin?` · дальше: ${esc(nx[0])}`:""}</div>
  ${now?`<div class="now">▶ ${esc(now)}</div>`:""}
  ${nextHTML(p,wst)}
  ${itemsHTML(p,now)||(st?`<ul class="st">${st}</ul>`:"")}
  ${(p.items||[]).length?"":pr(bad,"")+pr(w,"w")}
  ${cmdsHTML(p)}
  ${wst==="wiped"?`<div class="need" style="background:#173222;color:#8fd6a0">✅ Почищен — всё наше удалено, можно отдавать${p.order?". Не забудь нажать «Выдан» в заказе":""}</div>`:wst==="wipestart"?`<div class="need">🧹 Чистится — 2–4 минуты. Потом здесь будет «✅ можно отдавать» и придёт сообщение в боте заказов</div>`:wst==="wipefail"?`<div class="pr"><b>Уборка не прошла</b> — ${esc(W.n||"")}</div>`:""}
  ${p.off||wst==="wipestart"||wst==="wiped"?"":actsHTML(p)}
  ${p.text?`<details><summary>Подробно</summary><pre>${esc(txt(p.text))}</pre></details>`:""}</div>`}

// 25.11 17:46 (Алмаз): весь список — ✅ встало (зелёным), ⏳ впереди (серым), ▶ идёт (синим), ❌ ошибка + «Для Claude» — скопировать и вставить в чат Claude
let PCS=[],APPS={},DG=[];
// 25.11 19:28 (Алмаз: «раздел про стресс-тест пусть показывает этапы — где сломалось и на чём»): этапы теста с ПК (p.test.rows)
const TSI={OK:["✅","ok"],WARN:["⚠️","wa"],FAIL:["❌","fa"],SKIP:["⏭","pl"],RUN:["▶","ru"],WAIT:["⏳","pl"],STOP:["⛔","fa"]};
const TSW={SKIP:"пропущен",WAIT:"впереди",STOP:"оборвался"};
function testRows(p){return ((p.test||{}).rows||[])}
function testHTML(p){const r=testRows(p);if(!r.length)return "";
  const li=r.map(x=>{const [ic,c]=TSI[x.s]||["•",""];
    return `<li class="${c}">${ic} ${esc(x.t)}${x.m?` <small>· ${x.m} мин</small>`:""}${TSW[x.s]?` <small>· ${TSW[x.s]}</small>`:""}${x.n&&x.s!=="OK"?`<small style="display:block">${esc(x.n)}</small>`:""}</li>`}).join("");
  const bad=r.filter(x=>x.s==="FAIL"||x.s==="STOP").length,w=r.filter(x=>x.s==="WARN").length,ok=r.filter(x=>x.s==="OK").length,run=r.some(x=>x.s==="RUN");
  const sum=`Этапы теста: ${r.length}${ok?` · ✅ ${ok}`:""}${w?` · ⚠️ ${w}`:""}${bad?` · ❌ ${bad}`:""}${run?" · ▶ идёт":""}`;
  return `<details class="tsd" data-ts="1"${bad||w||run?" open":""}><summary>${sum}</summary><ul class="ts">${li}</ul></details>`}
function testText(p){return testRows(p).map(x=>`${(TSI[x.s]||["•"])[0]} ${x.t}${TSW[x.s]?" ("+TSW[x.s]+")":""}${x.n&&x.s!=="OK"?" — "+x.n:""}`).join("\n")}
function itemsHTML(p,now){const it=(p.items||[]).filter(x=>(x.s||"").toUpperCase()!=="SKIP"),pl=p.plan||[];   // 25.11 18:31 (Алмаз): пропущенное («NVIDIA не найдена» у офисного) не показываемif(!it.length&&!pl.length&&!testRows(p).length)return "";
  const row=x=>{const s=(x.s||"").toUpperCase();const c=s==="OK"?"ok":s==="FAIL"?"fa":s==="WARN"?"wa":s==="SKIP"?"pl":"";
    const ic=s==="OK"?"✅":s==="FAIL"?"❌":s==="WARN"?"⚠️":s==="SKIP"?"⏭":"•";
    return `<li class="${c}"><span class="ic">${ic}</span><span>${esc(x.t)}${x.n&&s!=="OK"?`<small>${esc(x.n)}</small>`:""}${x.k==="test"?testHTML(p):""}</span>${s==="FAIL"||s==="WARN"?`<button class="cp" data-cp="${esc(p.pc)}|${esc(x.t)}">📋 Для Claude</button>`:""}</li>`};
  return `<ul class="it">${it.map(row).join("")}${!p.fin&&now?`<li class="ru"><span class="ic">▶</span><span>${esc(now)}</span></li>`:""}${!it.some(x=>x.k==="test")&&testRows(p).length?`<li class="ru"><span class="ic">🧪</span><span>Стресс-тест${testHTML(p)}</span></li>`:""}${pl.map(t=>`<li class="pl"><span class="ic">⏳</span><span>${esc(t)}</span></li>`).join("")}</ul>`}
const CMDN={steam:"Скачать из Steam",mode:"Режим",svc:"Сервис",rush:"Срочно отдать",games:"Игры",app:"Программа",gametest:"Игровой тест",off:"Выключить",reboot:"Перезагрузить",bind:"Привязать к",unbind:"Отвязать"};
const CMDS={new:"⏳ ждёт ПК",run:"▶ выполняется",ok:"✅ готово",fail:"❌ не вышло",lost:"⚠️ не дошла"};
function cmdsHTML(p){const c=(p.cmds||[]).filter(x=>Date.now()/1000-x.t<6*3600);if(!c.length)return "";
  return `<div class="cm">${c.slice(-4).map(x=>`<div class="${x.st}">${CMDS[x.st]||x.st} · ${CMDN[x.act]||x.act}${x.act==="app"&&APPS[x.arg]?" "+esc(APPS[x.arg]):x.act==="bind"?" "+esc(x.arg):""}${x.n?" — "+esc(x.n):""}</div>`).join("")}</div>`}
// 25.11 20:16 (Алмаз: «не совсем понятно, что делать дальше — просто стоит и всё»): блок «👉 Что дальше» — один-два шага с кнопкой.
// Состояние теста с ПК — p.gs {g: не хватает только игрового теста, v: не хватает только роликов} (TSHOP.ps1 .14+), у старых версий — по тексту строки теста.
function nextHTML(p,wst){
  if(p.off||wst)return "";
  const it=p.items||[],t=it.find(x=>x.k==="test")||{},tn=(t.n||"")+" "+(t.t||""),gs=p.gs||{};

async function load(){

    const j=await r.json();const ps=j.pcs||[];PCS=ps;APPS=j.apps||{};
    if(document.getElementById("sheet").classList.contains("on"))return;   // открыт выбор — не перерисовываем под рукой
    const on=ps.filter(p=>!p.off),bad=on.filter(p=>(p.problems||[]).some(x=>x.s==="FAIL")||(p.st||[]).some(s=>s[1]==="failed"||s[1]==="crashed"));

    const open=new Set([...document.querySelectorAll(".c details[open]:not(.tsd)")].map(d=>d.closest(".c").querySelector(".pc").textContent));

  }catch(e){document.getElementById("sum").textContent="нет связи с сервером, пробую ещё…";API=""}}
