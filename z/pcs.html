<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSHOP · ПК в работе</title><meta name="robots" content="noindex">
<style>
:root{--bg:#0f1115;--card:#181b21;--line:#272b33;--tx:#e9e7e2;--mut:#8f8d87;--ok:#3fb950;--warn:#e3a52f;--bad:#f0524f;--acc:#e03c3c;--blue:#4a9eff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header b{font-size:18px}header .sum{color:#c9c6bf;font-size:15px}header .sum i{font-style:normal;font-weight:700;color:var(--tx)}header .sum .r{color:#ff8c8a}
header a.back{font-size:15px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;color:var(--tx);text-decoration:none}
main{padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
@media(max-width:600px){main{grid-template-columns:1fr;padding:10px}}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-left:5px solid var(--blue)}
.c.ok{border-left-color:var(--ok)}.c.bad{border-left-color:var(--bad)}.c.warn{border-left-color:var(--warn)}.c.off{opacity:.55;border-left-color:#555}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.ord{font-size:20px;font-weight:800}.pc{color:var(--mut);font-size:13px}
.badge{font-size:12px;padding:2px 8px;border-radius:20px;background:#262a32;color:var(--mut)}.badge.r{background:#3a1d1d;color:#ff8c8a}.badge.y{background:#3a2f15;color:#f3c35c}.badge.g{background:#173222;color:#6fd68a}
.hw{color:var(--mut);font-size:13px;margin:4px 0 8px}
.bar{height:10px;background:#262a32;border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--blue)}
.c.ok .bar i{background:var(--ok)}.c.bad .bar i{background:var(--bad)}
.now{font-weight:600;margin:6px 0}.eta{color:var(--mut);font-size:13px}
ul.st{list-style:none;padding:0;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:13.5px}
ul.st li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}ul.st li.a{color:var(--tx);font-weight:700}ul.st li.f{color:var(--bad);font-weight:700}ul.st li.d{color:#9fc9a9}
.pr{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:#2a1616;font-size:13.5px}.pr.w{background:#2a2312}
.pr div+div{margin-top:4px}.pr b{color:#ff8c8a}.pr.w b{color:#f3c35c}
.need{margin-top:8px;padding:8px 10px;border-radius:10px;background:#16263d;color:#9cc8ff;font-weight:600;font-size:14px}
details{margin-top:8px}summary{cursor:pointer;color:var(--mut);font-size:13px}pre{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,Consolas,monospace;color:#cfcac0;margin:6px 0 0}
ul.it{list-style:none;padding:0;margin:8px 0;font-size:13.5px}ul.it li{display:flex;gap:7px;align-items:flex-start;padding:2px 0}
ul.it li .ic{width:18px;text-align:center;flex:none}ul.it li.ok{color:#8fd6a0}ul.it li.pl{color:#77756f}ul.it li.ru{color:#7fb6ff;font-weight:700}
ul.it li.fa{color:#ff8c8a;font-weight:700}ul.it li.wa{color:#f3c35c}ul.it li small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
ul.ts{list-style:none;padding:4px 0 2px 4px;margin:4px 0 0;border-left:2px solid #2a2f39;font-size:13px;font-weight:400}ul.ts li{padding:2px 0 2px 6px}ul.ts li.ok{color:#8fd6a0}ul.ts li.fa{color:#ff8c8a;font-weight:700}ul.ts li.wa{color:#f3c35c}ul.ts li.ru{color:#7fb6ff;font-weight:700}ul.ts li.pl{color:#77756f}ul.ts li small{color:var(--mut);font-weight:400}
details.tsd{margin-top:2px}details.tsd summary{font-size:12.5px}
.ws{margin-top:8px;padding:10px 12px;border-radius:10px;background:#16263d;color:#9cc8ff;font-size:14px}.ws.late{background:#2a2312;color:#f3c35c}.ws.done{background:#173222;color:#8fd6a0}
.ws .wsh{font-weight:600}.wsb{height:6px;background:#22344d;border-radius:4px;overflow:hidden;margin:8px 0;position:relative}.ws.late .wsb{background:#3a2f15}
.wsb i{position:absolute;top:0;bottom:0;left:-35%;width:35%;background:var(--blue);border-radius:4px;animation:wsl 1.4s ease-in-out infinite}.ws.late .wsb i{background:var(--warn)}
@keyframes wsl{0%{left:-35%}100%{left:100%}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #9cc8ff55;border-top-color:#9cc8ff;border-radius:50%;animation:spn .8s linear infinite;vertical-align:-1px;margin-right:4px}@keyframes spn{to{transform:rotate(360deg)}}
.wss{display:flex;gap:5px;flex-wrap:wrap;font-size:12.5px;align-items:center}.wss span{padding:2px 8px;border-radius:12px;background:#1f2a3a;color:var(--mut)}.wss span.on{background:#2a4b75;color:#fff;font-weight:700}.wss span.ok{color:#8fd6a0}
.wss b{color:var(--mut);font-weight:400}.ws .wsn{margin-top:6px;font-size:13px}.ws button{margin:8px 6px 0 0;background:#232833;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
.nx{margin:8px 0;padding:9px 11px;border-radius:10px;background:#1b2435;border:1px solid #2c3a55;font-size:14px}.nx>b{display:block;color:#9cc8ff;margin-bottom:4px}
.nx div{display:flex;gap:8px;align-items:center;padding:3px 0}.nx div span{flex:1}.nx button{flex:none;background:#2a3f63;color:#fff;border:1px solid #3d5a8a;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.cp{margin-left:auto;flex:none;font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid #5a2a2a;background:#2a1616;color:#ff8c8a;cursor:pointer}
.cp.rt{border-color:#2f4f7a;background:#16202e;color:#8fbcf0}.cp.hp{border-color:#6a5a1f;background:#2a2512;color:#f3c35c}.sn .cp{margin:5px 6px 0 0}.rt .cp{margin:0 0 0 6px;padding:0 6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.acts button{background:#232833;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
.acts button:hover{border-color:#4a9eff}.acts button.dn{color:#ff8c8a}
.cm{margin-top:8px;font-size:12.5px;color:var(--mut)}.cm div{padding:1px 0}.cm .run{color:#7fb6ff}.cm .ok{color:#8fd6a0}.cm .fail,.cm .lost{color:#ff8c8a}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}#sheet.on{display:flex}
#sheet .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(460px,94vw);max-height:84vh;overflow:auto}
#sheet h3{margin:0 0 10px;font-size:16px}#sheet label{display:flex;gap:8px;padding:5px 0;font-size:14px;cursor:pointer}#sheet label.hv{color:var(--mut)}
#sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}#sheet .row button{border-radius:9px;padding:8px 14px;border:0;cursor:pointer;font-size:14px}
#sheet .go{background:var(--acc);color:#fff}#sheet .go.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}#sheet .go.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff4}#sheet .go.hold.ing i{width:100%;transition:width 2s linear}#sheet .no{background:#2a2f39;color:var(--tx)}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#232833;border:1px solid var(--line);padding:9px 14px;border-radius:10px;display:none;z-index:10}
/* 26.11 (Алмаз): у каждого этапа своя полоска — зелёная готово, синяя бегущая идёт, серая впереди; справа проценты и время */
ul.sp{list-style:none;padding:0;margin:10px 0 4px;font-size:14px}ul.sp>li{padding:5px 0}
.sr{display:grid;grid-template-columns:22px minmax(110px,44%) 1fr auto;gap:10px;align-items:center}
.sr .ic{text-align:center;font-size:15px}.sr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .pb{height:8px;background:#262a32;border-radius:5px;overflow:hidden;position:relative}.sr .pb i{display:block;height:100%;border-radius:5px;background:#3a3f49}
.sr .rt{font-size:12.5px;color:var(--mut);white-space:nowrap;text-align:right;min-width:118px}
.sr.s-ok .pb i{background:#2f9e4a}.sr.s-ok .nm{color:#cfe9d5}.sr.s-wait .nm{color:#8a877f}
.sr.s-fa .pb i{background:var(--bad)}.sr.s-fa .nm,.sr.s-fa .rt{color:#ff8c8a;font-weight:700}.sr.s-wa .pb i{background:var(--warn)}.sr.s-wa .nm{color:#f3c35c}
.sr.s-run .nm{color:#9cc8ff;font-weight:700}.sr.s-run .rt{color:#9cc8ff}.sr.s-run .pb i{background-color:var(--blue);background-image:repeating-linear-gradient(45deg,#ffffff2e 0 8px,transparent 8px 16px);background-size:23px 23px;animation:mv 1s linear infinite}
.sr.s-slow .pb i{background-color:var(--warn)}.sr.s-slow .rt{color:#f3c35c}
@media(max-width:600px){.sr{grid-template-columns:22px 1fr auto;grid-template-areas:"ic nm rt" ". pb pb";row-gap:4px}.sr .ic{grid-area:ic}.sr .nm{grid-area:nm}.sr .rt{grid-area:rt;min-width:0}.sr .pb{grid-area:pb}
  ul.sp ul.sp{margin-left:14px}ul.sp ul.sp .sr{grid-template-columns:20px 1fr auto}.sr small,.sn{margin-left:32px}}
.c{min-width:0}
@keyframes mv{from{background-position:0 0}to{background-position:23px 0}}
.sr small,.sn{display:block;font-size:12.5px;color:var(--mut);font-weight:400;margin:2px 0 0 32px;white-space:normal}
li.grp>details>summary{list-style:none;cursor:pointer}li.grp>details>summary::-webkit-details-marker{display:none}
li.grp>details>summary .nm::after{content:" ▸";color:var(--mut)}li.grp>details[open]>summary .nm::after{content:" ▾"}
ul.sp ul.sp{margin:4px 0 2px 32px;padding-left:8px;border-left:2px solid #2a2f39;font-size:13px}ul.sp ul.sp .sr{grid-template-columns:20px minmax(100px,42%) 1fr auto}
.c.rb{border-left-color:#7a8cff}.badge.b{background:#1d2540;color:#9fb2ff}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 10px;font-size:17px}
</style></head><body data-tab="pcs">
<script>
// 26.11 (Алмаз: «сверху панель, чтобы не нажимать назад, а сразу переходить»): общая панель переходов во всех окнах приложения
(function(){if(/[?&]bar=1/.test(location.search))return;   // панель уже есть у приложения сверху
const IN_=window.top!==window,cur=document.body.dataset.tab||"";
const T=[["orders","📦 Заказы"],["chats","💬 Чаты"],["pcs","🖥 ПК"],["bot","🧠 Бот"],["content","🎨 Контент"],["buy","🛒 Закуп"]];
const n=document.createElement("nav");n.id="tnav";
n.innerHTML=T.map(([k,l])=>'<button data-t="'+k+'"'+(k===cur?' class="on"':'')+'>'+l+'</button>').join("");
document.body.prepend(n);
n.onclick=e=>{const b=e.target.closest("[data-t]");if(!b||b.dataset.t===cur)return;
  if(IN_)window.parent.postMessage({nav:b.dataset.t},location.origin);else location.href="/z/app.html#"+b.dataset.t};
const s=document.createElement("style");
s.textContent="#tnav{position:sticky;top:0;z-index:6;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#0b0d11;border-bottom:1px solid #272b33;scrollbar-width:none}#tnav::-webkit-scrollbar{display:none}#tnav button{flex:none;font:600 13.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#c9c7c2;background:#1a1d24;border:1px solid #272b33;border-radius:10px;padding:6px 10px;cursor:pointer}@media(min-width:700px){#tnav{justify-content:center}}#tnav button.on{background:#e03c3c;border-color:#e03c3c;color:#fff}";
document.head.appendChild(s);
const fix=()=>{const h=n.offsetHeight;document.querySelectorAll("header").forEach(x=>{if(getComputedStyle(x).position==="sticky")x.style.top=h+"px"})};
fix();addEventListener("resize",fix)})();
</script>

<header><a href="#" onclick="goApp();return false" class="back">← Заказы</a><b>🖥 ПК в работе</b><span class="sum" id="sum">загружаю…</span></header>
<main id="list"></main><div id="sheet"><div class="box" id="sbox"></div></div><div id="toast"></div>
<script>
// Окно «ПК в работе» (решение Алмаза 25.11 17:18). Данные — GET /api/pcs (pc_live.py), ПК присылают их сами раз в минуту.
const IN=window.top!==window;
function goOrder(id){if(IN)window.parent.postMessage({pcs:"order",id},location.origin);else location.href='/z/app.html#order:'+id}
function goApp(){if(IN)window.parent.postMessage({pcs:"close"},location.origin);else location.href='/z/app.html'}
const LS={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}}};
const DEV=LS.get("tshop_dev");let API="";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function apiBase(){if(API)return API;const j=await (await fetch("/z/api.json?"+Date.now(),{cache:"no-store"})).json();
  if(j.direct){try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),2500);const r=await fetch(j.direct+"/ping",{cache:"no-store",signal:c.signal});clearTimeout(tm);if(r.ok){API=j.direct;return API}}catch(e){}}
  API=j.base||"";return API}
const ICON={done:"✅",ok:"✅",active:"▶️",running:"▶️",pending:"⏳",failed:"❌",crashed:"💥",skipped:"⏭",skip:"⏭"};
function ago(s){if(s<90)return "только что";if(s<3600)return Math.round(s/60)+" мин назад";if(s<86400)return Math.round(s/3600)+" ч назад";return Math.round(s/86400)+" дн назад"}
function txt(h){return String(h||"").replace(/<br\s*\/?>/g,"\n").replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')}
// 25.11 18:45 (Алмаз): ПК принесли без установки — флешка TEST\DIAG.bat в Windows клиента, выбор режима и итог здесь
const MODEN={warranty:"🛠 Гарантия / сервис",tradein:"💰 Трейд-ин / выкуп",quick:"⚡ Быстрая проверка"};
function checkCard(p){
  const bad=(p.items||[]).filter(x=>x.s==="FAIL"),w=(p.items||[]).filter(x=>x.s==="WARN"),ok=(p.items||[]).filter(x=>x.s==="OK");
  const cls=p.off&&!p.fin?"off":p.fin?(bad.length?"bad":w.length?"warn":"ok"):"";
  const st=p.fin?`<span class="badge ${bad.length?"r":w.length?"y":"g"}">${esc(p.verdict||"готово")}</span>`:p.off?`<span class="badge">нет связи · ${ago(p.ago)}</span>`:`<span class="badge">идёт · ${ago(p.ago)}</span>`;
  const pick=!p.mode&&!p.off?`<div class="need">Что делаем с этим компьютером? (или 1/2/3 на самом ПК)</div><div class="acts">
    <button data-mode="warranty" data-pc="${esc(p.pc)}">🛠 Гарантия / сервис · ошибки, что ставили, тест 15 мин</button>
    <button data-mode="tradein" data-pc="${esc(p.pc)}">💰 Трейд-ин / выкуп · тест 15 мин + блок питания 10 мин + оценка</button>
    <button data-mode="quick" data-pc="${esc(p.pc)}">⚡ Быстро · 2 мин без теста</button></div>`:"";
  const li=(a,ic,c)=>a.map(x=>`<li class="${c}"><span class="ic">${ic}</span><span>${esc(x.t)}</span>${c==="fa"?`<button class="cp" data-cpc="${esc(p.pc)}">📋 Для Claude</button>`:""}</li>`).join("");
  return `<div class="c ${cls}"><div class="top"><span class="ord">🔎 ${p.mode?MODEN[p.mode]:"Проверка без установки"}</span><span class="pc">${esc(p.pc)}</span>${st}</div>
  ${[p.cpu,p.gpu,p.ram].filter(Boolean).length?`<div class="hw">${[p.cpu,p.gpu,p.ram].filter(Boolean).map(esc).join(" · ")}</div>`:""}
  ${p.fin?"":`<div class="bar"><i style="width:${Math.max(2,Math.min(100,p.pct||0))}%"></i></div>`}
  ${p.now&&!p.fin?`<div class="now">▶ ${esc(p.now)}</div>`:""}
  ${pick}
  ${p.own?`<div class="now" style="font-weight:600">${esc(p.own)}</div>`:""}
  ${p.fin?`<ul class="it">${li(bad,"❌","fa")}${li(w,"⚠️","wa")}${li(ok,"✅","ok")}</ul>`:""}
  ${p.fin&&(p.mode==="warranty"||p.mode==="quick"||p.mode==="tradein")?(p.ai?`<details open><summary>${p.mode==="tradein"?"🧠 Подробный разбор и вердикт Claude":"🧠 Вывод: что было и гарантия ли это"}</summary><pre>${esc(p.ai)}</pre></details>`:`<div class="now">🧠 ${p.mode==="tradein"?"Claude разбирает проверку и готовит вердикт…":"ИИ разбирает, что было с компьютером…"}</div>`):""}
  ${p.est?`<details open><summary>💰 Оценка трейд-ина</summary><pre>${esc(p.est)}</pre></details>`:""}
  ${p.fin&&(p.ext||{}).progs&&p.ext.progs.length?`<details><summary>📦 Что ставили после установки Windows (${p.ext.progs.length})</summary><pre>${esc(p.ext.progs.join("\n"))}${(p.ext.drivers||[]).length?"\n\nДрайверы:\n"+esc(p.ext.drivers.join("\n")):""}</pre></details>`:""}
  ${p.text&&p.fin?`<details><summary>Подробно</summary><pre>${esc(p.text)}</pre></details>`:""}
  ${p.fin?`<div class="eta">Компьютер можно отдавать или выключать — на нём ничего не осталось. Отчёт ушёл и в Telegram.</div>`:""}</div>`}
// 28.11 (Алмаз: «заказ тут не вышел — винда установилась, написано „без заказа“, привязать можно только на компе»): новый ПК,
// пока ждёт выбора заказа (~3 мин после Windows), сам в окно не пишет — сервер показывает его по вопросу «какой заказ?» (pc_bind)
const BSN={svc:"🛠 сервис",trade:"💰 трейд-ин"};
function bindCard(p){const ch=p.chosen,hw=[p.cpu,p.gpu,p.ram,p.mb].filter(Boolean).map(esc).join(" · ");
  const badge=ch?`<span class="badge g">выбран ${BSN[ch]||"заказ "+esc(ch)}</span>`:`<span class="badge y">ждёт заказ · ${ago(Math.max(0,SNOW-(p.since||p.t)))}</span>`;
  const body=ch?`<div class="now">✅ ${BSN[ch]?"Выбран "+BSN[ch]:"Привязан к заказу "+esc(ch)} — ПК подхватит в течение минуты, дальше здесь появится ход установки</div>`
    :`<div class="nx"><b>👉 Что дальше</b><div>🔗 <span>Windows установилась. Серийники с пиком не совпали — выбери, какой это заказ. Не выберешь за ~3 мин — установка пойдёт дальше без заказа (привязать можно и потом, здесь же)</span><button data-act="bind" data-pc="${esc(p.pc)}">🔗 Привязать</button></div></div>`;
  return `<div class="c${ch?"":" warn"}"><div class="top"><span class="ord">🖥 Включился по сети</span><span class="pc">${esc(p.pc)}</span>${badge}</div>
  ${hw?`<div class="hw">${hw}</div>`:""}${body}</div>`}
function card(p){if(p.kind==="check")return checkCard(p);if(p.kind==="bind")return bindCard(p);
  const fail=(p.st||[]).some(s=>s[1]==="failed"||s[1]==="crashed")||(p.problems||[]).some(x=>x.s==="FAIL");
  const warn=(p.problems||[]).some(x=>x.s==="WARN");
  const W=p.wipe||{},rushRun=(p.cmds||[]).some(c=>c.act==="rush"&&(c.st==="ok"||c.st==="run")&&Date.now()/1000-c.t<1800);
  // 28.11 (Алмаз: «отправил на чистку — непонятно, отправил или нет, никакой анимации»): нажал «🧹 Почистить» —
  // сразу «команда отправлена» с бегущей полоской, пока ПК её не заберёт (watch.ps1 смотрит раз в 2 мин). wq — когда нажал
  const rushNew=(p.cmds||[]).find(c=>c.act==="rush"&&c.st==="new"&&Date.now()/1000-c.t<1800);
  const wq=Math.max(p.wreq||0,WSENT[p.pc]||0,rushNew?rushNew.t:0);
  let wst=(W.st&&!(wq&&(W.t||0)<wq))?W.st:"";   // старая «уборка не прошла» до нового нажатия — не показываем
  if(!wst&&rushRun)wst="wipestart";
  if(!wst&&wq)wst="wsent";

// 28.11 (Алмаз): ход чистки после нажатия — 1 ПК забирает команду → 2 чистится → 3 можно отдавать; бегущая полоска и сколько прошло.

    if(x.s==="WARN"){doneM+=m;return bar("s-wa","⚠️",x.t,100,x.m?`${x.m} мин`:"замечание",(x.n?`<small class="sn">${esc(x.n)}</small>`:"")+fx())}

  if(p.off||wst)return "";
  const it=p.items||[],t=it.find(x=>x.k==="test")||{},tn=(t.n||"")+" "+(t.t||""),gs=p.gs||{};
  const btn=(a,x)=>`<button data-act="${a}" data-pc="${esc(p.pc)}">${x}</button>`;
  const L=[];
  const run=(p.cmds||[]).find(c=>(c.st==="run"||c.st==="new")&&Date.now()/1000-c.t<3600);
  if(run)L.push(["⏳",`Идёт «${CMDN[run.act]||run.act}» — ничего не нажимать, итог появится здесь`]);
  else if(!p.fin){
    L.push(["⏳","Ничего не делать — ПК всё делает сам"+(p.eta?`, готов примерно к ${esc(p.eta)}`:"")]);
    if(p.wait&&!p.order&&!p.svc)L.push(["🔗","Выбери, какой это заказ (можно и позже — паспорт и ролики догонят)",btn("bind","🔗 Привязать")]);
  }else{
    const bad=(t.s||"").toUpperCase()==="FAIL"||(p.problems||[]).some(x=>x.s==="FAIL");
    const vOnly=String(gs.v)==="1"||/ролики теста не записаны|ролики игрового теста/i.test(tn);
    const gOnly=!vOnly&&(String(gs.g)==="1"||/игровой тест[^.]*не запускал|CS2 не запустилась/i.test(tn));
    if(bad&&(vOnly||gOnly)&&!p.office){
      L.push(["🎯",vOnly?"Железо проверено, не хватает ролика теста — переснять игру и ролик (~25 мин, ПК не трогать)":"Игровой тест не прошёл — запустить заново (~25 мин)",btn("gametest","🎯 Игровой тест")]);
      L.push(["🆘","Второй раз не вышло — у строки теста «🆘 Позвать Claude» (заявка), или «📋 Для Claude» и вставь мне в чат"]);
    }else if(bad)L.push(["🔁","Ошибка — у красной строки: «🔁 Допроверить» (только этот этап) или «🆘 Позвать Claude». ПК не выключай"]);
    else if(p.order)L.push(["🧹","Готов. Почисти к выдаче, потом «Выдан» в заказе",btn("wipe","🧹 Почистить")]);
    else L.push(["🧹","Готов. Отдаёшь без заказа — почисти",btn("rush","🧹 Почистить")]);
    if(!p.order&&!p.svc)L.push(["🔗","Это чей-то заказ или сервис — привяжи, паспорт и ролики уйдут туда",btn("bind","🔗 Привязать")]);
  }
  return `<div class="nx"><b>👉 Что дальше</b>${L.map(x=>`<div>${x[0]} <span>${x[1]}</span>${x[2]||""}</div>`).join("")}</div>`}

async function load(){

    if(r.status===403){document.getElementById("list").innerHTML=`<div class="empty">Нет доступа — подтверди это устройство в приложении «TSHOP Заказы».</div>`;return}
    const j=await r.json();const ps=j.pcs||[];PCS=ps;APPS=j.apps||{};NORMS=Object.assign({steps:{},test:{},test_tpl:[]},j.norms||{});SNOW=j.now||Date.now()/1000;FETCHED=Date.now();
    for(const p of ps)if(WSENT[p.pc]&&(p.wreq||SNOW-WSENT[p.pc]>90))delete WSENT[p.pc];
    if(document.getElementById("sheet").classList.contains("on"))return;   // открыт выбор — не перерисовываем под рукой
    const isRb=p=>p.off&&!p.fin&&!p.wipe&&p.ago<3600&&p.kind!=="check";
    const on=ps.filter(p=>!p.off||isRb(p)),bad=on.filter(p=>(p.problems||[]).some(x=>x.s==="FAIL")||(p.items||[]).some(x=>(x.s||"").toUpperCase()==="FAIL")||(p.st||[]).some(s=>s[1]==="failed"||s[1]==="crashed")||(isRb(p)&&p.ago>45*60));
    const nrb=on.filter(isRb).length;
    document.getElementById("sum").innerHTML=`в работе <i>${on.length}</i>${nrb?` (перезагружается ${nrb})`:""} · готовы <i>${on.filter(p=>p.fin).length}</i> · с ошибкой <i${bad.length?' class="r"':""}>${bad.length}</i> · обновлено ${new Date().toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;
    try{if(IN)window.parent.postMessage({pcs:"n",n:on.length,bad:bad.length},location.origin)}catch(_){}
    const open=new Set([...document.querySelectorAll(".c details[open]:not(.tsd)")].map(d=>d.closest(".c").querySelector(".pc").textContent));
    const tsOpen=new Map([...document.querySelectorAll(".c details.tsd")].map(d=>[d.closest(".c").querySelector(".pc").textContent,d.open]));   // свернул/развернул стресс-тест — так и остаётся
    DG=j.diag||[];
    // 25.11 18:53 (Алмаз: «я его 20 минут назад отдал, а система видит»): отключённые больше 5 мин и почищенные / готовые, а также
    // молчащие больше 2 ч — в свёрнутый архив внизу, наверху только то, что сейчас в работе
    const gone=p=>p.off&&(p.ago>7200||(p.ago>300&&(p.fin||p.wipe||(p.cmds||[]).some(c=>c.act==="rush"&&c.st==="ok"))));
    const live=ps.filter(p=>!gone(p)),old=ps.filter(gone);
    const wasOld=!!document.querySelector("#pcarch[open]");
    document.getElementById("list").innerHTML=(live.length?live.map(card).join(""):`<div class="empty">Сейчас ни один ПК не ставится</div>`)
      +(old.length?`<details id="pcarch" style="grid-column:1/-1"${wasOld?" open":""}><summary style="font-size:14px;padding:6px 2px">🗄 Отключённые и отданные ПК за 3 дня (${old.length})</summary><div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));margin-top:10px">${old.map(card).join("")}</div></details>`:"")
      +diagBlock();
    document.querySelectorAll(".c").forEach(c=>{const k=c.querySelector(".pc").textContent;if(open.has(k)){const d=c.querySelector("details:not(.tsd)");if(d)d.open=true}if(tsOpen.has(k)){const d=c.querySelector("details.tsd");if(d)d.open=tsOpen.get(k)}});
  }catch(e){document.getElementById("sum").textContent="нет связи с сервером, пробую ещё…";API=""}}
load();setInterval(load,10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});   // 26.11: вернулся в приложение — сразу свежее
</script></body></html>
