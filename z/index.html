<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TSHOP · Статус заказа</title>
<meta name="description" content="Следите за сборкой, установкой Windows и тестом вашего компьютера TSHOP">
<meta property="og:title" content="TSHOP · Статус вашего заказа">
<meta property="og:description" content="Сборка, установка Windows и стресс-тест — в реальном времени">
<meta name="theme-color" content="#0f1013">
<link rel="manifest" href="/z/manifest.json">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TSHOP заказ">
<meta name="robots" content="noindex">
<style>
:root{--bg:#0f1013;--panel:#17181d;--card:#1e2027;--line:#2c2f39;--text:#ecedf0;--muted:#9a9eab;--dim:#6b7080;--red:#e53946;--red2:#ff5562;--green:#2fbf71}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.logo{font-weight:900;font-style:italic;font-size:24px;letter-spacing:.5px}
.logo b{color:var(--red)}
.code{color:var(--muted);font-size:13px}
.code b{color:var(--text);letter-spacing:.6px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.hero{background:linear-gradient(135deg,#25121a,#17181d 60%);border-color:#3a1f27}
.hero .now{font-size:20px;font-weight:800}
.bar{height:10px;background:#2a2d36;border-radius:8px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:8px;transition:width .6s}
.bar.ok i{background:var(--green)}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.k{color:var(--muted)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:6px 0;position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;left:11px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::after{background:var(--green)}
.dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;border:2px solid var(--line);background:var(--bg);z-index:1}
.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.now .dot{border-color:var(--red);box-shadow:0 0 0 4px rgba(229,57,70,.2)}
.now .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.steps .t{flex:1}
.steps .t b{font-weight:600}
.next .t{color:var(--dim)}
.steps .at{color:var(--dim);font-size:13px;white-space:nowrap}
.part{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid #23252d}
.part:last-child{border:0}
.part .k{min-width:110px}
.ok{color:var(--green);font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{flex:1;min-width:140px;text-align:center;text-decoration:none;color:#fff;font-weight:700;border-radius:12px;padding:13px;background:var(--card);border:1px solid var(--line)}
.btn.wa{background:#1fa855;border-color:#1fa855}
code{font-size:12px;color:var(--muted);word-break:break-all}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:20px}
.hint{color:var(--dim);font-size:13px}
.msg{text-align:center;padding:60px 10px;color:var(--muted)}
.sel{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;margin:4px 0 10px;appearance:none}
.sel.chg{border-color:var(--red)}
.lbl{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 12px;color:var(--text);font:inherit;cursor:pointer}
.chip.on{border-color:var(--red);color:var(--red2)}
.ext{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid #23252d;cursor:pointer;border-radius:8px}
.ext.on{background:rgba(229,57,70,.12)}
.ext img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px}
.ext .t{flex:1}.ext small{color:var(--muted);display:block}
.ext .p{white-space:nowrap;font-weight:700}
.save{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;color:#fff;background:var(--red);margin-top:10px;cursor:pointer}
.save:disabled{opacity:.45}
.part.ed{position:relative;cursor:pointer;align-items:center}
.part.ed .v{flex:1}.part.ed .go{color:var(--dim);font-size:13px;white-space:nowrap}
.part.ed.chg .v{color:var(--red2,#ff5562);font-weight:700}.part.ed .was{display:block;color:var(--dim);font-size:12px;font-weight:400;text-decoration:line-through}
.part.ed .dd{display:block;color:var(--muted);font-size:12px;font-weight:400}
.part.ed.off .v{color:var(--dim)}
.part.ed select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.edbar{position:sticky;bottom:10px;z-index:5;display:flex;gap:12px;align-items:center;background:#1e2027;border:1px solid var(--red);border-radius:14px;padding:10px 10px 10px 14px;margin:0 0 12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.edbar .s{flex:1;font-weight:800;font-size:17px}.edbar .s small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.edbar .save{width:auto;margin:0;padding:12px 16px}.edbar .x{background:none;border:0;color:var(--dim);font:inherit;padding:8px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:17px;font-weight:800;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2d36;border:1px solid var(--line);border-radius:10px;padding:11px 16px;display:none;z-index:9;max-width:90vw}
.ask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.ask .box{background:#1e2027;border:1px solid #2c2f39;border-radius:16px;padding:20px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ask .q{font-size:17px;font-weight:700;margin-bottom:6px}
.ask .d{color:#9a9eab;font-size:14px;margin-bottom:16px;white-space:pre-line}
.ask .bb{display:flex;gap:10px}
.ask button{flex:1;border-radius:12px;padding:13px;font:inherit;font-weight:700;border:1px solid #2c2f39;background:#252831;color:#ecedf0;cursor:pointer}
.ask button.ok{background:#e53946;border-color:#e53946;color:#fff}
.cols{display:block}.dk{display:none}
.gm{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid #23252d;cursor:pointer;border-radius:8px}
.gm .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px}
.gm.on .bx{background:var(--green);border-color:var(--green);color:#fff}
.sum{font-size:24px;font-weight:800}
/* компьютер: две колонки — слева ход заказа, справа сборка и действия */
@media (min-width:980px){
  html,body{font-size:16px}
  .wrap{max-width:1180px;padding:28px 32px 48px}
  .dk{display:block}.mb{display:none}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .card{padding:20px;margin-bottom:16px}
  h1{font-size:28px}.hero .now{font-size:24px}.logo{font-size:28px}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Загружаем ваш заказ…</div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// код заказа: из ссылки; если кабинет открыт с экрана «Домой» (там ссылка без кода) — из памяти телефона
const T=(()=>{let t=new URLSearchParams(location.search).get("t")||"";try{if(t)localStorage.setItem("tshop_t",t);else t=localStorage.getItem("tshop_t")||""}catch(e){}return t.toUpperCase()})();
const SHOP={phone:"+7 747 345 89 52",wa:"https://wa.me/77473458952",ig:"https://instagram.com/tshopkz"};
let BASE="",timer=null,D=null,ED={set:{},add:[],cat:""},GS=null,BUSY=false;
const money=v=>Number(v||0).toLocaleString("ru-RU").replace(/,/g," ")+" ₸";
function toast(t){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";e.className="toast";document.body.appendChild(e)}e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",3500)}
function contacts(s){s=s||SHOP;return `<div class="btns"><a class="btn wa" href="${s.wa}" target="_blank" rel="noopener">💬 Написать в WhatsApp</a><a class="btn" href="${s.ig}" target="_blank" rel="noopener">Instagram @tshopkz</a></div>`}
function fail(t){$("#app").innerHTML=`<div class="top"><div class="logo"><b>T</b>SHOP</div></div><div class="card"><p style="margin:0 0 12px">${t}</p>${contacts()}</div>`}
async function base(){
  const r=await fetch("/z/api.json?"+Date.now(),{cache:"no-store"});
  if(!r.ok)throw 0; BASE=(await r.json()).base||""; if(!BASE)throw 0;
}
async function load(retry){
  if(!T){fail(`Введите код заказа — он в конце вашей ссылки (tshopkz.kz/<b>ARCZAZ</b>):<br><input id="tcode" class="sel" style="margin-top:10px;text-transform:uppercase" placeholder="Например ARCZAZ" autocapitalize="characters"><button class="save" onclick="const v=document.getElementById('tcode').value.trim();if(v)location.href='/z/?t='+encodeURIComponent(v.toUpperCase())">Открыть заказ</button>`);return}
  try{
    if(!BASE)await base();
    const r=await fetch(BASE+"/c/"+encodeURIComponent(T),{cache:"no-store"});
    if(r.status===404){fail('📨 Заказ получен и ждёт подтверждения менеджера — страница оживёт сразу после подтверждения (в рабочее время обычно в течение часа). Сохраните эту ссылку.<br><br><span style="color:#9a9eab;font-size:13px">Если заказ давний, а страница так и не открылась — напишите нам.</span>');return}
    if(!r.ok)throw 0;
    const j=await r.json();
    const pending=Object.keys(ED.set).length||ED.add.length||ED.open||GS||ISSUE||UP||(document.activeElement&&document.activeElement.tagName==="SELECT");
    if(!BUSY&&!pending&&!(document.activeElement&&document.activeElement.tagName==="SELECT"))render(j);
  }catch(e){
    if(!retry){BASE="";return load(true)}
    if(!$(".hero"))fail("Статус сейчас обновляется — загляните через пару минут или напишите нам.");
  }
}
function addonsHTML(d){
  if(!d.addons||!d.addons.length)return "";
  return `<div class="card"><h3>Добавлено к заказу</h3>${d.addons.map(a=>`<div class="part"><span class="t" style="flex:1">${esc(a.name)}</span><span>${money(a.price)} · ${a.paid?'<span class="ok">оплачено</span>':'<span style="color:#f2b33d">ждёт доплаты</span>'}</span></div>`).join("")}
    ${d.due?`<div class="tot"><span>К доплате</span><span>${money(d.due)}</span></div><p class="sub" style="margin:6px 0 0;font-size:13px">Менеджер пришлёт счёт на доплату.</p>`:""}</div>`}
// ---- уведомления о статусе (Web Push): приходят, даже когда браузер закрыт ----
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent), STANDALONE=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const PUSH_OK="serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
function pushOn(){try{return localStorage.getItem("tshop_push_"+T)==="1"&&Notification.permission==="granted"}catch(e){return false}}
function pushHTML(d){
  if(!d.vapid||d.stage==="cancel")return "";
  const after=d.stage==="done";
  if(pushOn())return after?"":`<div class="card"><div class="row"><span>🔔 Уведомления о статусе включены</span><span class="ok">✓</span></div><p class="hint" style="margin:4px 0 0">Сообщим, когда ПК соберут, пройдёт тест и он будет готов — даже если страница закрыта.</p></div>`;
  if(IOS&&!STANDALONE)return `<div class="card"><h3>🔔 Уведомления о статусе</h3><p class="sub" style="margin:0;font-size:14px">На iPhone: нажмите «Поделиться» <b>⬆︎</b> внизу Safari → «На экран „Домой“», откройте TSHOP с экрана и нажмите здесь «Включить уведомления».</p></div>`;
  if(!PUSH_OK)return "";
  if(Notification.permission==="denied")return `<div class="card"><p class="hint" style="margin:0">🔕 Уведомления запрещены в настройках браузера — разрешите их для tshopkz.kz, чтобы получать статус заказа.</p></div>`;
  return `<button class="btn" id="pushBtn" style="display:block;width:100%;margin:0 0 12px;border-color:#3a1f27">${after?"🔔 Напомнить о чистке через год":"🔔 Сообщать о статусе заказа"}</button>`;
}
async function enablePush(){
  const b=$("#pushBtn"); if(b){b.disabled=true;b.textContent="Подключаю…"}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("Уведомления не разрешены");render(D);return}
    const reg=await navigator.serviceWorker.register("/z/sw.js",{scope:"/z/"});
    await navigator.serviceWorker.ready;
    const key=Uint8Array.from(atob(D.vapid.replace(/-/g,"+").replace(/_/g,"/")+"==".slice(0,(4-D.vapid.length%4)%4)),c=>c.charCodeAt(0));
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
    const r=await fetch(BASE+"/c/"+encodeURIComponent(T)+"/sub",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(sub)});
    if(!r.ok)throw 0;
    try{localStorage.setItem("tshop_push_"+T,"1")}catch(e){}
    toast("🔔 Готово — пришлём уведомление на каждом этапе");render(D);
  }catch(e){toast("⚠️ Не получилось включить — попробуйте ещё раз");render(D)}
}
// ---- после выдачи: «Мой компьютер TSHOP» — гарантия, документы, обращение ----
let ISSUE=false,ISSUE_PH="";
function minePC(d){
  const w=d.warranty; if(!w)return "";
  const form=ISSUE?`<div style="margin-top:12px"><textarea id="issTxt" class="sel" rows="4" style="resize:vertical" placeholder="Что случилось? Например: при игре выключается, шумит, не видит монитор…"></textarea>
      <label class="btn" style="display:block;margin:0 0 8px;cursor:pointer">📷 ${ISSUE_PH?"Фото добавлено ✓":"Добавить фото (необязательно)"}<input type="file" accept="image/*" id="issPh" style="display:none"></label>
      <button class="save" id="issSend">Отправить мастеру</button>
      <p class="hint" style="margin:8px 0 0">Мастер увидит ваш заказ, дату покупки и серийные номера — повторять ничего не нужно.</p></div>`:"";
  return `<div class="card hero" style="background:linear-gradient(135deg,#10251a,#17181d 60%);border-color:#1f3a2a"><h3>Гарантия</h3>
    <div class="row" style="align-items:baseline"><span class="sum" style="font-size:20px">${w.active?"✅ до "+esc(w.until):"Гарантия истекла"}</span><span class="${w.active?"ok":"k"}">${esc(w.left)}</span></div>
    ${w.active&&w.total?`<div style="height:8px;border-radius:4px;background:#2a2c33;margin:6px 0 12px;overflow:hidden"><div style="height:100%;width:${Math.max(2,Math.round(100*w.days/w.total))}%;background:linear-gradient(90deg,#2ecc71,#58d68d);border-radius:4px"></div></div>`:""}
    <div class="row"><span class="k">Куплен</span><span>${esc(w.from)}</span></div>
    <div class="row"><span class="k">Гарантийный №</span><span>${esc(w.no)}</span></div>
    ${d.passport?`<a class="btn" style="display:block;margin-top:10px" href="${BASE}/c/${encodeURIComponent(T)}/passport.pdf" target="_blank" rel="noopener">📄 Паспорт компьютера и гарантия (PDF)</a>`:""}
    <p class="hint" style="margin:8px 0 0">Сохраните эту страницу — здесь всегда ваши документы, даже если бумажный талон потеряется.</p></div>
    <div class="card"><h3>Что-то не так с компьютером?</h3>
    ${ISSUE?"":`<button class="save" id="issOpen" style="margin-top:0">🛠 Сообщить о проблеме</button>`}${form}
    <div class="btns" style="margin-top:10px"><a class="btn wa" href="${esc(d.issueWa||SHOP.wa)}" target="_blank" rel="noopener">💬 Написать в WhatsApp</a></div></div>
    ${upHTML(d)}
    <div class="card"><h3>Обслуживание</h3>
    <div class="row"><span>🧹 Чистка от пыли и замена термопасты</span><span class="k">раз в год</span></div></div>`;
}
// ---- апгрейд / новый ПК с зачётом: оценка по его железу, заявка мастеру ----
let UP=false,UPW=[];
const UP_OPTS=["Новый ПК с зачётом старого","Видеокарта мощнее","Процессор","Больше памяти","SSD побольше","Монитор"];
function upHTML(d){
  const t=d.tradein||{rows:[]};
  const est=t.lo?`<div class="tot" style="margin-top:6px"><span>Ваш ПК в зачёт ≈</span><span>${money(t.lo).replace(" ₸","")} – ${money(t.hi)}</span></div>
      <p class="hint" style="margin:4px 0 0">По ценам б/у на OLX сейчас, без платы, блока питания и корпуса. Точно — после осмотра, 15 минут.</p>`
    :`<p class="sub" style="margin:0;font-size:14px">Оценим ваш ПК в зачёт нового — пришлите заявку, ответим в WhatsApp.</p>`;
  const form=UP?`<div style="margin-top:12px"><div class="lbl">Что хотите?</div><div class="chips">${UP_OPTS.map(x=>`<button class="chip${UPW.includes(x)?" on":""}" data-up="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <textarea id="upNote" class="sel" rows="2" placeholder="Бюджет, игры, пожелания — необязательно"></textarea>
      <button class="save" id="upSend">Отправить заявку</button>
      <p class="hint" style="margin:8px 0 0">Мастер видит ваш компьютер и оценку — подберёт варианты и напишет в WhatsApp.</p></div>`:`<button class="save" id="upOpen">⚡ Хочу апгрейд или новый ПК</button>`;
  return `<div class="card"><h3>Апгрейд и трейд-ин</h3>${est}${form}
    <div class="btns" style="margin-top:10px"><a class="btn" href="/" target="_blank" rel="noopener">Смотреть сборки на сайте</a></div></div>`;
}
async function sendUp(){
  if(!UPW.length){toast("Выберите, что хотите");return}
  const note=($("#upNote")||{}).value||"";
  BUSY=true;$("#upSend").disabled=true;
  try{const r=await fetch(BASE+"/c/"+encodeURIComponent(T)+"/upgrade",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({what:UPW,note})});
    const j=await r.json();if(!r.ok){toast("⚠️ "+(j.error||"Не получилось"));return}
    UP=false;UPW=[];render(D);toast("✅ Заявка у мастера — напишет в WhatsApp с вариантами");
  }catch(e){toast("⚠️ Нет связи — напишите нам в WhatsApp")} finally{BUSY=false;const b=$("#upSend");if(b)b.disabled=false}
}
async function photoData(file){
  const img=await createImageBitmap(file), k=Math.min(1,1600/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.82);
}
async function sendIssue(){
  const t=($("#issTxt")||{}).value||"";
  if(t.trim().length<3&&!ISSUE_PH){toast("Опишите, что случилось");return}
  BUSY=true;$("#issSend").disabled=true;$("#issSend").textContent="Отправляю…";
  try{const r=await fetch(BASE+"/c/"+encodeURIComponent(T)+"/issue",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({text:t,photo:ISSUE_PH})});
    const j=await r.json(); if(!r.ok){toast("⚠️ "+(j.error||"Не получилось"));return}

  const parts=d.parts.length?(d.edit&&d.edit.mode==="full"?buildEditHTML(d):`<div class="card"><h3>${esc(d.title)}${d.cash?" · "+money(d.cash):""}</h3>${d.parts.map(p=>`<div class="part"><span class="k">${esc(p.name)}</span><span>${esc(p.val)}</span></div>`).join("")}
    ${d.games.length&&!d.gamesEdit?`<div class="part"><span class="k">Игры</span><span>${esc(d.games.join(", "))}</span></div>`:""}</div>`):"";
  const h=d.hw, r=(k,v,sn)=>v?`<div class="part"><span class="k">${k}</span><span>${esc(v)}${sn?`<br><code>S/N ${esc(sn)}</code>`:""}</span></div>`:"";
  const hw=h?`<div class="card"><h3>Серийные номера (для гарантии)</h3>${r("Процессор",h.cpu)}${r("Видеокарта",h.gpu,h.gpu_sn)}${r("Плата",h.mb,h.mb_sn)}
    ${(h.ram||[]).map((m,i)=>r("Память "+(i+1),`${m.gb} ГБ ${m.model||""}`,m.sn)).join("")}${(h.disks||[]).map(x=>r("SSD",`${x.model}`,x.sn)).join("")}</div>`:"";
  const pick=ready&&d.pickup?`<div class="card"><h3>Самовывоз</h3><div>${esc(d.shop.addr)}</div><div class="k">${esc(d.shop.hours)}</div>
    <div class="btns"><a class="btn" href="https://2gis.kz/astana/search/${encodeURIComponent("Петрова 18/1")}" target="_blank" rel="noopener">📍 Открыть в 2ГИС</a></div></div>`:"";
  const ask_=`<div class="card"><h3>Вопросы?</h3><div class="row"><span class="k">Телефон</span><a href="tel:${(d.shop.phone||"").replace(/\s/g,"")}" style="color:inherit">${esc(d.shop.phone)}</a></div>${contacts(d.shop)}</div>`;
  $("#app").innerHTML=`<div class="top"><div class="logo"><b>T</b>SHOP</div><div class="code">Заказ <b>${esc(d.id)}</b></div></div>
    <h1>${d.name?esc(d.name)+", в":"В"}аш компьютер</h1><p class="sub">${esc(d.title)} · заказ от ${esc(d.created)}</p>
    ${d.shop&&d.shop.closed?`<div class="card" style="border-color:#6b4a12;background:#241c0e">🏖 ${esc(d.shop.closed)}</div>`:""}
    <div class="cols"><div>
    <div class="card hero">${hero}</div>
    ${pushHTML(d)}${minePC(d)}
    ${done?"":`<div class="card"><h3>Этапы</h3><ul class="steps">${steps}</ul></div>`}
    ${done?"":test}${pick}${payHTML(d)}${hw}
    <div class="dk">${ask_}</div>
    </div><div>
    ${parts}
    ${d.share?`<button class="btn" id="shareBuild" style="display:block;width:100%;margin:-2px 0 12px">📤 Поделиться сборкой с друзьями</button>`:""}
    ${gamesHTML(d)}${addonsHTML(d)}${editHTML(d)}
    ${d.canCancel?`<div style="text-align:center;margin:4px 0 14px"><button id="cancelOrder" style="background:none;border:0;color:#9a9eab;text-decoration:underline;font:inherit;cursor:pointer;padding:10px">Отменить заказ</button></div>`:""}
    </div></div><div class="mb">${ask_}</div>
    <div class="foot">Страница обновляется сама · TSHOP — игровые компьютеры, Астана</div>`;
  clearTimeout(timer); if(!done)timer=setTimeout(()=>load(),30000);
}
load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
