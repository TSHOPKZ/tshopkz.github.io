<meta name="robots" content="noindex">
<meta property="og:title" content="TSHOP — игровые ПК из Instagram, актуальные цены">
<meta property="og:description" content="Введите номер с фото поста — увидите цену на сегодня, замените детали и закажите в два касания.">
<meta property="og:image" content="https://tshopkz.kz/img/og.jpg">

<meta name="theme-color" content="#d6202b">
<script>
/* Короткие адреса: tshopkz.kz/1041 → карточка сборки №1041 (/#1041).
   Для сборок с готовой страницей /1041/ GitHub Pages отдаёт её сам; сюда попадают
   новые номера, у которых страницы ещё нет, и любые опечатки в адресе. */
(function(){
  var m=location.pathname.match(/^\/(\d{3,4})\/?$/);
  var q=location.search||"";
  if(m){location.replace("/"+q+"#"+m[1]);return}
  /* tshopkz.kz/panel — панель заказов (для своих); tshopkz.kz/K7QDXM — страница заказа для клиента */
  if(/^\/panel\/?$/i.test(location.pathname)){location.replace("/z/panel.html"+q);return}
  var z=location.pathname.match(/^\/([A-Za-z0-9]{5,12})\/?$/);
  if(z&&/[A-Za-z]/.test(z[1])){location.replace("/z/?t="+z[1].toUpperCase());return}
  location.replace("/"+q);
})();
</script>
